
name: Cypress E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Executar testes Cypress
        uses: cypress-io/github-action@v7
        with:
          browser: electron

      - name: Consolidar relatórios Mochawesome
        if: always()
        run: |
          if compgen -G "cypress/reports/mochawesome/*.json" > /dev/null; then
            npx mochawesome-merge "cypress/reports/mochawesome/*.json" -o cypress/reports/relatorio-final.json
            npx marge cypress/reports/relatorio-final.json -f relatorio-final -o cypress/reports/html
          else
            echo "Nenhum relatório JSON encontrado."
          fi

      - name: Publicar relatório de execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cypress-mochawesome
          path: cypress/reports/html/
          if-no-files-found: warn
          retention-days: 30
